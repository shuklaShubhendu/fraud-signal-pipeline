name: CI — Lint, Test, Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/test_scoring.py tests/test_validation.py tests/test_resiliency.py -v --tb=short

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fraud_pipeline
          POSTGRES_USER: pipeline
          POSTGRES_PASSWORD: pipeline_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply schema
        run: |
          PGPASSWORD=pipeline_secret psql -h localhost -U pipeline -d fraud_pipeline -f init.sql

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+asyncpg://pipeline:pipeline_secret@localhost:5432/fraud_pipeline
          DATABASE_URL_SYNC: postgresql://pipeline:pipeline_secret@localhost:5432/fraud_pipeline
        run: |
          pytest tests/test_integration.py tests/test_idempotency.py -v --tb=short -m integration

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fraud-signal-pipeline:test .

      - name: Verify image
        run: docker run --rm fraud-signal-pipeline:test python -c "import fastapi; print('OK')"
