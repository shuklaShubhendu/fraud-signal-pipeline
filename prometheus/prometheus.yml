global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "fraud-consumer"
    static_configs:
      - targets: ["consumer:8002"]
    metrics_path: /metrics

  - job_name: "fraud-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: "risk-api"
    static_configs:
      - targets: ["risk-api:8001"]
    metrics_path: /metrics
